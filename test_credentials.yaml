# =====================================================================
# MKK Auth — Test Credentials
# =====================================================================
# Bu dosya Flask uygulaması tarafından okunur ve mock provider'ları besler.
# Aynı zamanda /TEST_USERS.md sayfasında kullanıcılara gösterilir.
#
# Production'da bu dosya OLMAYACAK — gerçek veri Oracle/LDAP'tan gelecek.
# Şu an sadece test/demo için.
# =====================================================================

# ----- Username + Password kullanıcıları -----
usernames:
  - username: emrecan
    password: test1234
    name: "Emrecan Bayhan"
    phone: "05321234567"
    email: "emrecan@mkk.com.tr"
    role: admin
  - username: ali
    password: ali5678
    name: "Ali Yılmaz"
    phone: "05332345678"
    email: "ali@mkk.com.tr"
    role: user

# ----- TCKN ile (bireysel) -----
tckn:
  - tckn: "11111111110"
    password: tckn1234
    name: "Emrecan Bayhan"
    phone: "05321234567"
    email: "emrecan@mkk.com.tr"
  - tckn: "22222222220"
    password: tckn5678
    name: "Ali Yılmaz"
    phone: "05332345678"
    email: "ali@mkk.com.tr"

# ----- VKN ile (kurumsal) -----
vkn:
  - vkn: "1234567890"
    password: vkn1234
    company: "Demo Ticaret A.Ş."
    phone: "02121234567"
    email: "info@demo.com.tr"

# ----- Sicil No ile -----
sicil:
  - sicil: "001234"
    password: sicil12
    name: "Emrecan Bayhan"
    department: "BT"
    phone: "05321234567"
    email: "emrecan@mkk.com.tr"

# ----- Passport (yabancı yatırımcı) -----
passport:
  - passport: "U12345678"
    password: pass1234
    name: "John Smith"
    country: "USA"
    phone: "+14155552671"
    email: "john@example.com"

# ----- MERSIS (şirket sorgusu — temsilciler dahil) -----
mersis:
  - mersis: "0123456789012345"
    company_name: "Acme Aracı Kurum A.Ş."
    representatives:
      - tckn: "11111111110"
        sicil: "001234"
        name: "Emrecan Bayhan"
        phone: "05321234567"
        email: "emrecan@acme.com.tr"
      - tckn: "22222222220"
        sicil: "005678"
        name: "Ali Yılmaz"
        phone: "05332345678"
        email: "ali@acme.com.tr"
  - mersis: "9876543210987654"
    company_name: "Beta Holding A.Ş. (tek temsilcili)"
    representatives:
      - tckn: "33333333330"
        sicil: "009999"
        name: "Veli Demir"
        phone: "05551234567"
        email: "veli@beta.com.tr"

# ----- LDAP / Active Directory -----
ldap:
  - username: ldapuser
    password: ldap1234
    cn: "Demo LDAP User"
    dn: "cn=ldapuser,ou=users,dc=mkk,dc=local"
    memberOf:
      - users
      - developers
  - username: ldapadmin
    password: admin123
    cn: "LDAP Admin"
    dn: "cn=ldapadmin,ou=admins,dc=mkk,dc=local"
    memberOf:
      - admins
      - users

# ----- e-Devlet / GIB / Custom external IDP -----
external_idp:
  edevlet:
    base_url: "https://giris.turkiye.gov.tr/oauth2/authorize"
    fake_user:
      tckn: "11111111110"
      name: "Emrecan Bayhan"
      verified_via: "TC Kimlik"
  gib:
    base_url: "https://intvrg.gib.gov.tr/oauth2/authorize"
    fake_user:
      vkn: "1234567890"
      company_title: "Demo Ticaret A.Ş."
      verified_via: "GIB"

# ----- e-İmza (USB token) -----
esign:
  fake_subject:
    name: "Emrecan Bayhan"
    tckn: "11111111110"
    cert_serial: "123456789ABCDEF"
    issuer: "TUBITAK Kamu SM"
  # Demo: 0000 dışında 4+ haneli herhangi bir PIN kabul edilir

# ----- Mobil İmza -----
mobile_sign:
  fake_user:
    name: "Emrecan Bayhan"
    tckn: "11111111110"
    operator: "Turkcell"
    verified_via: "Mobil İmza"

# ----- TOTP -----
totp:
  # Demo: 000000 dışında 6 haneli herhangi bir kod kabul edilir
  hint: "Test için herhangi 6 hane (000000 hariç) kabul edilir"

# ----- Captcha -----
captcha:
  # Demo: herhangi bir non-empty değer kabul edilir
  hint: "Reels captcha — herhangi bir değer girebilirsin"

# ----- Image Captcha -----
image_captcha:
  # Kütüphane kodu üretip session'a kaydeder, kullanıcı ekrandaki kodu girer
  hint: "Resimde gösterilen kodu aynen gir (büyük/küçük harf duyarsız)"
